name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SHERPA_VERSION: v1.13.8
  SHERPA_DIR: sherpa-onnx-v1.13.8-win-x64-shared-MD-Release
  # https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/
  #   sherpa-onnx-v1.13.8-win-x64-shared-MD-Release.tar.bz2
  SHERPA_SHA256: 3e971a04b2e0ba4dfa53d381a006367ce8c9f5f09b4ae00043e9845c2baded22

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      # build.rs が sherpa-onnx のインポートライブラリを要求するため、
      # テストのコンパイル前に SDK を配置する。
      - name: Setup sherpa-onnx
        uses: ./.github/actions/setup-sherpa

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        shell: pwsh
        run: |
          # Cargo 1.100 以降、テスト実行ファイルは target\debug\build\<pkg>\<hash>\out に
          # 置かれ、DLL はその隣に無い。build.rs が DLL をコピーする target\debug を
          # PATH に追加して解決させる。
          $env:PATH = "$env:GITHUB_WORKSPACE\target\debug;$env:PATH"
          cargo test --locked

  # Cargo.toml の rust-version 宣言を実際にビルドして検証する。
  # stable だけを回していると、let chains のように 1.88 以降でしか
  # コンパイルできないコードが混ざっても宣言の誤りに気づけない。
  msrv:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust (MSRV)
        uses: dtolnay/rust-toolchain@1.88

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: Setup sherpa-onnx
        uses: ./.github/actions/setup-sherpa

      - name: Check with MSRV toolchain
        run: cargo check --locked --all-targets

  # 常駐してキーボードをフックするバイナリを配布しているため、
  # 依存クレートの既知脆弱性を push / PR ごとに確認する。
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
